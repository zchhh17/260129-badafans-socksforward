name: Sync socksforward upstream

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时同步一次
  workflow_dispatch:
# 👇 加这个
defaults:
  run:
    shell: bash
    
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/badafans/socksforward.git || true

      - name: Fetch upstream (all branches + tags)
        run: |
          git fetch upstream --tags

      - name: Sync branches
        run: |
          for branch in $(git branch -r | grep upstream/ | grep -v HEAD | sed 's|upstream/||'); do
            git checkout -B "$branch" "upstream/$branch"
            git push origin "$branch" --force
          done

      - name: Sync tags
        run: |
          git push origin --tags --force

      - name: Sync releases (assets included)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dummy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
